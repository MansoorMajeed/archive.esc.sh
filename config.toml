baseurl = "https://archive.esc.sh"
title = "Esc.sh Archive"
locale = "en"
defaultcontentlanguage = "en"

pagination.pagerSize = 20

[markup.highlight]
style = "github-dark"


# The layouts use the template structure introduced in Hugo 0.146
# (layouts/_partials, page.html, section.html, ...).
[module]
  [module.hugoVersion]
    min = "0.146.0"

# This is needed to add raw html to markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  author = "Mansoor"
  description = "Mansoor's blog archive: posts on Linux, SRE, Kubernetes and self-hosting, from 2012 onwards."
  keywords = "blog,sre,devops,personal"
  gitRepo = "https://github.com/MansoorMajeed/archive.esc.sh"
  since = 2012

  # Where newer writing lives; shown in the nav, post footers and site footer.
  newsletterURL = "https://newsletter.esc.sh"
  newsletterName = "newsletter.esc.sh"

[params.plausibleAnalytics]
  domain = "archive.esc.sh"
  serverURL = "plaus.esc.sh"

# Giscus comments
[params.giscus] # https://giscus.app
  repo = "MansoorMajeed/esc.sh"
  repoID = "R_kgDOJmOhmg"
  category = "Esc.sh Comments"
  categoryID = "DIC_kwDOJmOhms4CWqw2"
  mapping = "pathname"
  term = ""
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "en"
  loading = "lazy"


[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

