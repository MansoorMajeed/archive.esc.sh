<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, home">
      <kbd class="brand__key">esc</kbd><span class="brand__rest">.sh</span><span class="brand__tag">archive</span>
    </a>
    <nav class="nav" aria-label="Main">
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $external := hasPrefix .URL "http" }}
        {{ $active := and (not $external) (or ($current.IsMenuCurrent "main" .) (hasPrefix $current.RelPermalink (.URL | relURL))) }}
        <a href="{{ if $external }}{{ .URL }}{{ else }}{{ .URL | relURL }}{{ end }}"
           {{- if $active }} aria-current="page"{{ end }}
           {{- if $external }} class="nav__external" rel="noopener"{{ end }}>{{ .Name }}{{ if $external }}<span aria-hidden="true"> ↗</span>{{ end }}</a>
      {{ end }}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
