{{ with site.Params.giscus }}{{ if and .repo (not $.Params.disableComments) }}
  <section class="comments" aria-label="Comments">
    <script>
      (function () {
        var theme = document.documentElement.getAttribute("data-theme") || "preferred_color_scheme";
        var s = document.createElement("script");
        s.src = "https://giscus.app/client.js";
        s.setAttribute("data-repo", {{ .repo }});
        s.setAttribute("data-repo-id", {{ .repoID }});
        s.setAttribute("data-category", {{ .category }});
        s.setAttribute("data-category-id", {{ .categoryID }});
        s.setAttribute("data-mapping", {{ .mapping | default "pathname" }});
        s.setAttribute("data-term", {{ .term | default "" }});
        s.setAttribute("data-strict", {{ .strict | default "0" }});
        s.setAttribute("data-reactions-enabled", {{ .reactionsEnabled | default "1" }});
        s.setAttribute("data-emit-metadata", {{ .emitMetadata | default "0" }});
        s.setAttribute("data-input-position", {{ .inputPosition | default "bottom" }});
        s.setAttribute("data-theme", theme);
        s.setAttribute("data-lang", {{ .lang | default "en" }});
        s.setAttribute("data-loading", {{ .loading | default "lazy" }});
        s.setAttribute("crossorigin", "anonymous");
        s.async = true;
        document.currentScript.parentNode.appendChild(s);
      })();
    </script>
  </section>
{{ end }}{{ end }}
